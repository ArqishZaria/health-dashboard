<div class="card mb-3 no-print filter-card">
  <div class="card-body">
    <form method="get" class="row g-2 align-items-end">
      <div class="col-6 col-md-2">
        <label class="form-label small mb-1">Year</label>
        <select name="year" class="form-select form-select-sm">
          <option value="">All (last 12 mo.)</option>
          {% for y in year_options %}
            <option value="{{ y }}" {% if filters.year == y|stringformat:"s" %}selected{% endif %}>{{ y }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small mb-1">Month</label>
        <select name="month" class="form-select form-select-sm">
          <option value="">All Months</option>
          {% for val, label in month_options %}
            <option value="{{ val }}" {% if filters.month == val|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small mb-1">Specific Date</label>
        <input type="date" name="day" class="form-control form-control-sm" value="{{ filters.raw.day }}" max="{% now 'Y-m-d' %}">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small mb-1">Region</label>
        <select name="region" id="geo_region" class="form-select form-select-sm">
          <option value="">All Regions</option>
          {% for r in region_options %}
            <option value="{{ r.id }}" {% if filters.region_id == r.id|stringformat:"s" %}selected{% endif %}>{{ r.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small mb-1">Local Council</label>
        <select name="local_council" id="geo_local_council" class="form-select form-select-sm">
          <option value="">All</option>
          {% for lc in local_council_options %}
            <option value="{{ lc.id }}" data-region="{{ lc.region_id }}" {% if filters.local_council_id == lc.id|stringformat:"s" %}selected{% endif %}>{{ lc.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small mb-1">Jamatkhana</label>
        <select name="jamat_khana" id="geo_jamat_khana" class="form-select form-select-sm">
          <option value="">All</option>
          {% for jk in jamat_khana_options %}
            <option value="{{ jk.id }}" data-lc="{{ jk.local_council_id }}" {% if filters.jamat_khana_id == jk.id|stringformat:"s" %}selected{% endif %}>{{ jk.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small mb-1">Screening Program</label>
        <select name="screening_program" class="form-select form-select-sm">
          <option value="">All Programs</option>
          {% for key, label in screening_options %}
            <option value="{{ key }}" {% if filters.screening_program == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small mb-1">Gender</label>
        <select name="gender" class="form-select form-select-sm">
          <option value="">All</option>
          {% for val, label in gender_options %}
            <option value="{{ val }}" {% if filters.gender == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12 col-md-4 d-flex gap-2">
        <button class="btn btn-primary btn-sm flex-grow-1"><i class="fa-solid fa-filter me-1"></i>Apply Filters</button>
        <a href="{% url 'dashboard:screening_dashboard' %}" class="btn btn-outline-secondary btn-sm">Reset</a>
      </div>
    </form>
    <div class="filter-meta">
      <div class="period-chip"><i class="fa-solid fa-calendar-days"></i>{{ filters.period_label }}</div>
      <div class="d-flex gap-2">
        <a href="{% url 'dashboard:screening_dashboard_export' %}?{{ export_qs }}" class="btn btn-outline-success btn-sm"><i class="fa-solid fa-file-csv me-1"></i>Export CSV</a>
        <button type="button" onclick="window.print()" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-print me-1"></i>Print</button>
      </div>
    </div>
  </div>
</div>
{% include "dashboard/_geo_cascade_script.html" %}

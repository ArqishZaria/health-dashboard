{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
<div class="ph">
  <div class="ph-row">
    <div class="ph-left">
      {% include "dashboard/_back_button.html" %}
      <div class="ph-titles">
        <span class="ph-eyebrow text-danger">Confirm</span>
        <h1 class="ph-title text-danger">Confirm Delete</h1>
      </div>
    </div>
  </div>
</div>
<div class="card col-lg-6 mx-auto">
  <div class="card-body text-center">
    <p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Delete</button>
      <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
